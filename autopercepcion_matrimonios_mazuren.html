<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autopercepcion estado de nuestro Matrimonio - Grp Conexion Parejas Mazuren</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --badge-bg: #2563eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 14px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 26px;
      padding-bottom: 18px;
      border-bottom: 2px solid #e2e8f0;
    }

    .header h1 {
      font-size: 1.35rem;
      color: var(--primary);
      line-height: 1.3;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .header p {
      font-size: 0.88rem;
      color: #64748b;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label.input-label {
      display: block;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: var(--primary);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .slider-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .slider-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: #334155;
    }

    .badge {
      background: var(--badge-bg);
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 3px 12px;
      border-radius: 20px;
      min-width: 40px;
      text-align: center;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .scale-lbl {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 700;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #cbd5e1;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button:active {
      transform: scale(0.99);
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .alert {
      padding: 14px;
      border-radius: 10px;
      margin-top: 18px;
      display: none;
      text-align: center;
      font-size: 0.92rem;
      font-weight: 500;
    }
    
    .alert-success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    
    .alert-danger {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Autopercepcion estado de nuestro Matrimonio</h1>
      <p>Grp Conexion Parejas Mazuren</p>
    </div>

    <form id="encuestaForm">
      <div class="form-group">
        <label for="nombre" class="input-label">Nombre Completo:</label>
        <input type="text" id="nombre" required placeholder="Escribe tu nombre y apellido">
      </div>

      <!-- Area 1: Comunicacion -->
      <div class="slider-card">
        <div class="slider-header">
          <span class="slider-title">1. Comunicación</span>
          <span id="val_comunicacion" class="badge">1</span>
        </div>
        <div class="slider-container">
          <span class="scale-lbl">1</span>
          <input type="range" id="comunicacion" min="1" max="10" value="1" oninput="document.getElementById('val_comunicacion').innerText = this.value">
          <span class="scale-lbl">10</span>
        </div>
      </div>

      <!-- Area 2: Sexual -->
      <div class="slider-card">
        <div class="slider-header">
          <span class="slider-title">2. Sexual</span>
          <span id="val_sexual" class="badge">1</span>
        </div>
        <div class="slider-container">
          <span class="scale-lbl">1</span>
          <input type="range" id="sexual" min="1" max="10" value="1" oninput="document.getElementById('val_sexual').innerText = this.value">
          <span class="scale-lbl">10</span>
        </div>
      </div>

      <!-- Area 3: Financiera -->
      <div class="slider-card">
        <div class="slider-header">
          <span class="slider-title">3. Financiera</span>
          <span id="val_financiera" class="badge">1</span>
        </div>
        <div class="slider-container">
          <span class="scale-lbl">1</span>
          <input type="range" id="financiera" min="1" max="10" value="1" oninput="document.getElementById('val_financiera').innerText = this.value">
          <span class="scale-lbl">10</span>
        </div>
      </div>

      <!-- Area 4: Oracion -->
      <div class="slider-card">
        <div class="slider-header">
          <span class="slider-title">4. Oración</span>
          <span id="val_oracion" class="badge">1</span>
        </div>
        <div class="slider-container">
          <span class="scale-lbl">1</span>
          <input type="range" id="oracion" min="1" max="10" value="1" oninput="document.getElementById('val_oracion').innerText = this.value">
          <span class="scale-lbl">10</span>
        </div>
      </div>

      <!-- Area 5: Lectura Palabra -->
      <div class="slider-card">
        <div class="slider-header">
          <span class="slider-title">5. Lectura Palabra</span>
          <span id="val_lecturaPalabra" class="badge">1</span>
        </div>
        <div class="slider-container">
          <span class="scale-lbl">1</span>
          <input type="range" id="lecturaPalabra" min="1" max="10" value="1" oninput="document.getElementById('val_lecturaPalabra').innerText = this.value">
          <span class="scale-lbl">10</span>
        </div>
      </div>

      <!-- Area 6: Compromiso Ministerial -->
      <div class="slider-card">
        <div class="slider-header">
          <span class="slider-title">6. Compromiso Ministerial</span>
          <span id="val_compromisoMinisterial" class="badge">1</span>
        </div>
        <div class="slider-container">
          <span class="scale-lbl">1</span>
          <input type="range" id="compromisoMinisterial" min="1" max="10" value="1" oninput="document.getElementById('val_compromisoMinisterial').innerText = this.value">
          <span class="scale-lbl">10</span>
        </div>
      </div>

      <!-- Area 7: Salud -->
      <div class="slider-card">
        <div class="slider-header">
          <span class="slider-title">7. Salud</span>
          <span id="val_salud" class="badge">1</span>
        </div>
        <div class="slider-container">
          <span class="scale-lbl">1</span>
          <input type="range" id="salud" min="1" max="10" value="1" oninput="document.getElementById('val_salud').innerText = this.value">
          <span class="scale-lbl">10</span>
        </div>
      </div>

      <button type="submit" id="btnEnviar">Enviar Calificación</button>
      <div id="alertMsg" class="alert"></div>
    </form>
  </div>

  <script>
    // URL desplegada de Google Apps Script
	const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQfVOmIVUHb15QK7gLe1YiD9SlaIgfjGD4AoKUA0A615Qa5KEtyAz7vv9tDSqya6px/exec';


    document.getElementById('encuestaForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnEnviar');
      const alertMsg = document.getElementById('alertMsg');
      
      btn.innerText = 'Enviando...';
      btn.disabled = true;
      alertMsg.style.display = 'none';

      const payload = {
        nombre: document.getElementById('nombre').value,
        comunicacion: document.getElementById('comunicacion').value,
        sexual: document.getElementById('sexual').value,
        financiera: document.getElementById('financiera').value,
        oracion: document.getElementById('oracion').value,
        lecturaPalabra: document.getElementById('lecturaPalabra').value,
        compromisoMinisterial: document.getElementById('compromisoMinisterial').value,
        salud: document.getElementById('salud').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alertMsg.className = 'alert alert-success';
        alertMsg.innerText = '¡Muchas gracias! Tu autopercepción ha sido registrada correctamente.';
        alertMsg.style.display = 'block';
        document.getElementById('encuestaForm').reset();
        
        // Resetear visualmente los indicadores numéricos a 5
        const badges = document.querySelectorAll('.badge');
        badges.forEach(b => b.innerText = '1');

        btn.innerText = 'Enviar Calificación';
        btn.disabled = false;
      })
      .catch(err => {
        alertMsg.className = 'alert alert-danger';
        alertMsg.innerText = 'Ocurrió un error al enviar. Por favor intenta nuevamente.';
        alertMsg.style.display = 'block';
        console.error(err);
        btn.innerText = 'Enviar Calificación';
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
